[project]
name = "llamagrid-control-plane"
version = "0.1.0"
description = "Production control plane for the LlamaGrid inference cluster"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
  "celery[redis]>=5.5,<6",
  "cryptography>=44,<46",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.21,<1",
  "structlog>=25,<26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
